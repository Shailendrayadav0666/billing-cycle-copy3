[pytest]
; Tests live at the repo-root tests/ tree (common/directory-structure.md), never under src/ —
; testpaths points there, relative to this ini file's own directory (src/backend), matching
; tests/.evals/config.json ci.roots[] "root": "src/backend" (the coverage command's cwd).
testpaths = ../../tests/unit/backend ../../tests/api
; pythonpath = . adds src/backend itself so `import main` resolves from any test file location.
pythonpath = .
