[pytest]
# tests always live at the repo root (tests/unit/backend), never under src/, per
# common/directory-structure.md — but tests/.evals/config.json's ci.roots[] coverageCommand for this
# root runs bare `pytest --cov=. --cov-report=xml` from src/backend with no path argument, relying on
# default discovery from cwd. Without this, that command collects 0 tests here, so the delta-scoped
# unitCoverage gate always found changed backend files "measured" as 0% instead of what pytest-cov
# actually produced when given an explicit path.
testpaths = ../../tests/unit/backend
